<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sata-Emu</title>
<link rel="icon" href="logo.png">
<link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b0b0c;
    --card: rgba(22, 22, 24, 0.75);
    --border: rgba(255, 255, 255, 0.08);
    --text: #f2f2f2;
    --muted: #7a7a80;
    --accent: #8f7bff;
    --accent2: #4fd1ff;
    --online: #3ddc84;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "JetBrains Mono", monospace;
    overflow-x: hidden;
    min-height: 100vh;
  }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: #0b0b0c; }
  ::-webkit-scrollbar-thumb { background: #2a2a30; border-radius: 4px; }

  /* ---------- background layers ---------- */
  #particles { position: fixed; inset: 0; z-index: 0; }
  .scanlines {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.025) 0 1px, transparent 1px 3px);
    animation: scan 8s linear infinite;
  }
  @keyframes scan { to { background-position: 0 300px; } }
  .vignette {
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.85) 100%);
  }
  .glow {
    position: fixed; width: 600px; height: 600px; border-radius: 50%;
    background: radial-gradient(circle, rgba(143,123,255,0.18), transparent 65%);
    z-index: 0; pointer-events: none;
    animation: drift 14s ease-in-out infinite alternate;
  }
  @keyframes drift {
    0% { transform: translate(-30%, -20%); }
    100% { transform: translate(30%, 20%); }
  }

  /* ---------- main card ---------- */
  main {
    position: relative; z-index: 2;
    display: flex; flex-direction: column; align-items: center; gap: 26px;
    width: min(440px, 90vw);
    margin: 0 auto;
    padding: calc(50vh - 130px) 0 90px;
    opacity: 0;
  }
  main.show { animation: rise 1s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(30px) scale(.97); filter: blur(6px); }
    to   { opacity: 1; transform: none; filter: none; }
  }

  .header { display: flex; align-items: center; gap: 18px; }

  .logo-wrap {
    position: relative; width: 96px; height: 96px; flex-shrink: 0;
    animation: float 5s ease-in-out infinite;
  }
  @keyframes float { 50% { transform: translateY(-8px); } }
  .logo-wrap::before {
    content: ""; position: absolute; inset: -4px; border-radius: 50%;
    background: conic-gradient(from 0deg, var(--accent), var(--accent2), transparent 40%, var(--accent));
    animation: spin 3s linear infinite;
    filter: blur(2px);
  }
  .logo-wrap::after {
    content: ""; position: absolute; inset: -18px; border-radius: 50%;
    background: radial-gradient(circle, rgba(143,123,255,.35), transparent 70%);
    animation: pulse 2.5s ease-in-out infinite;
    z-index: -1;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { opacity: .4; transform: scale(1.12); } }
  .logo-wrap img {
    position: relative; width: 100%; height: 100%; border-radius: 50%;
    object-fit: cover; border: 3px solid var(--bg); background: #111;
  }

  /* ---------- animated name ---------- */
  .name {
    font-family: "Anton", sans-serif;
    font-size: clamp(38px, 11vw, 56px);
    letter-spacing: 1px;
    line-height: 1;
    position: relative;
    display: flex;
    transform: rotate(-3deg) skewX(-4deg);
  }
  .name .ch {
    display: inline-block;
    opacity: 0;
    background: linear-gradient(180deg, #fff 30%, #cfcfe6 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 18px rgba(143,123,255,.25);
  }
  main.show .name .ch {
    animation: drop .6s cubic-bezier(.3,1.6,.5,1) forwards, wave 3s ease-in-out infinite;
    animation-delay: calc(var(--i) * 70ms + 300ms), calc(var(--i) * 120ms + 1.5s);
  }
  @keyframes drop {
    from { opacity: 0; transform: translateY(-40px) rotate(-12deg); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes wave { 0%, 100% { translate: 0 0; } 50% { translate: 0 -5px; } }

  /* glitch layers */
  .name::before, .name::after {
    content: attr(data-text);
    position: absolute; inset: 0;
    font: inherit; letter-spacing: inherit;
    opacity: 0; pointer-events: none;
  }
  .name::before { color: var(--accent2); }
  .name::after  { color: #ff4fa3; }
  main.show .name::before { animation: glitch1 4s infinite 2s; }
  main.show .name::after  { animation: glitch2 4s infinite 2s; }
  @keyframes glitch1 {
    0%, 90%, 100% { opacity: 0; transform: none; }
    91% { opacity: .8; transform: translate(-3px, 1px); clip-path: inset(10% 0 55% 0); }
    93% { opacity: .8; transform: translate(3px, -1px); clip-path: inset(60% 0 10% 0); }
    95% { opacity: 0; }
  }
  @keyframes glitch2 {
    0%, 91%, 100% { opacity: 0; transform: none; }
    92% { opacity: .8; transform: translate(3px, 0); clip-path: inset(40% 0 30% 0); }
    94% { opacity: .8; transform: translate(-2px, 1px); clip-path: inset(5% 0 75% 0); }
    96% { opacity: 0; }
  }

  /* ---------- status ---------- */
  .status {
    width: 100%;
    display: flex; align-items: center; gap: 12px;
    padding: 14px 18px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    backdrop-filter: blur(8px);
    position: relative; overflow: hidden;
    opacity: 0;
  }
  .status { opacity: 1; }
  @keyframes blink { 50% { opacity: .25; } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .dot {
    width: 10px; height: 10px; border-radius: 50%; background: var(--online); flex-shrink: 0;
  }
  .status-label { font-size: 10px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; }
  .status-text { font-size: 13px; font-weight: 700; letter-spacing: 1px; min-height: 1.2em; }

  .divider {
    display: flex; align-items: center; gap: 12px; width: 100%;
    font-size: 9px; letter-spacing: 4px; color: #555; text-transform: uppercase;
    opacity: 0;
  }
  main.show .divider { animation: fadeUp .7s ease forwards 1.4s; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  /* ---------- sections that appear on scroll ---------- */
  .section { width: 100%; display: flex; flex-direction: column; gap: 14px; margin-top: 8px; }
  .reveal { opacity: 0; transform: translateY(24px); transition: opacity .7s ease, transform .7s cubic-bezier(.2,.8,.2,1); }
  .reveal.in { opacity: 1; transform: none; }
  .section .divider { animation: none !important; }

  /* ---------- changelog ---------- */
  .log {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 18px; backdrop-filter: blur(8px);
    position: relative;
  }
  .log::before {
    content: ""; position: absolute; left: 0; top: 14px; bottom: 14px; width: 2px;
    background: linear-gradient(var(--accent), var(--accent2)); border-radius: 2px;
  }
  .log-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  .log-title { font-size: 13px; font-weight: 700; letter-spacing: 1px; }
  .log-date { font-size: 10px; color: var(--muted); letter-spacing: 1px; white-space: nowrap; }
  .log-tag {
    display: inline-block; font-size: 9px; letter-spacing: 2px; text-transform: uppercase;
    padding: 2px 6px; border-radius: 4px; margin-right: 8px;
    background: rgba(143,123,255,.15); color: #b9adff; vertical-align: 1px;
  }
  .log ul { list-style: none; display: flex; flex-direction: column; gap: 5px; }
  .log li { font-size: 12px; color: #c9c9cf; line-height: 1.5; padding-left: 16px; position: relative; }
  .log li::before { content: "›"; position: absolute; left: 2px; color: var(--accent); }

  /* ---------- X posts ---------- */
  .x-follow {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 14px; border-radius: 10px; text-decoration: none; color: var(--text);
    background: var(--card); border: 1px solid var(--border); backdrop-filter: blur(8px);
    font-size: 12px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
    transition: border-color .25s ease, transform .25s ease, background .25s ease;
  }
  .x-follow:hover { border-color: rgba(255,255,255,.25); transform: translateY(-2px); background: rgba(30,30,34,.85); }
  .x-follow span { color: var(--muted); font-weight: 400; text-transform: none; letter-spacing: 1px; }
  .x-posts { display: flex; flex-direction: column; gap: 4px; }
  .x-posts .twitter-tweet { margin: 0 auto !important; }
  .x-empty { font-size: 11px; color: var(--muted); text-align: center; padding: 6px 0; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; }
  }
</style>
</head>
<body>

<canvas id="particles"></canvas>
<div class="glow"></div>
<div class="scanlines"></div>
<div class="vignette"></div>

<main id="main" class="show">
  <div class="header">
    <div class="logo-wrap">
      <!-- Put your logo in the repo as logo.png or logo.jpg. The Discord link is only a backup: Discord links expire after a while. -->
      <img id="logo" src="logo.png" alt="Sata-Emu logo">
    </div>
    <h1 class="name" id="name" data-text="SATA-EMU"></h1>
  </div>

  <div class="divider">status</div>

  <div class="status">
    <div class="dot"></div>
    <div>
      <div class="status-label">currently</div>
      <div class="status-text"><span id="status">Developing</span></div>
    </div>
  </div>

  <section class="section">
    <div class="divider reveal">changelog</div>
    <div id="changelog" class="section" style="margin-top:0"></div>
  </section>

  <section class="section">
    <div class="divider reveal">latest on x</div>
    <div id="xposts" class="x-posts"></div>
    <a class="x-follow reveal" id="xfollow" target="_blank" rel="noopener">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M18.9 2H22l-6.8 7.8L23 22h-6.2l-4.8-6.3L6.4 22H3.3l7.3-8.3L1 2h6.3l4.4 5.8L18.9 2zm-1.1 18h1.7L6.3 3.9H4.5L17.8 20z"/></svg>
      Follow on X <span id="xhandle"></span>
    </a>
  </section>
</main>


<!-- Your song: music.mp3 or Music.mp3 both work -->
<audio id="music" loop preload="auto">
  <source src="Music.mp3" type="audio/mpeg">
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
  /* =====================================================
     CHANGELOG — add new updates at the TOP of this list.
     Copy one { ... }, block, paste it above the others, change the text.
     tag is optional (e.g. "new", "fix", "update").
     ===================================================== */
  const CHANGELOG = [
    {
      title: "Site launched",
      date: "Nov 22, 2026",
      tag: "new",
      items: [
        "Sata-Emu site is live",
        "Added status and changelog"
      ]
    }
  ];

  /* =====================================================
     X / TWITTER
     X_HANDLE: your @ without the @
     X_POSTS: paste links to posts you want shown, newest first.
       Get a link: on the post, click Share > Copy link.
       Example: "https://x.com/satawired/status/1234567890123456789"
     ===================================================== */
  const X_HANDLE = "satawired";
  const X_POSTS = [
    "https://x.com/satawired/status/2124634717698015635",
     "https://x.com/satawired/status/2124387690355515490",
  ];

  /* logo: tries each name until one loads */
  (function () {
    const tries = ["Logo.png", "logo.jpg", "Logo.jpg",
      "https://media.discordapp.net/attachments/1573947758342184960/1573947801979592835/3383c8933de00e467128e038d13c07cc.jpg?ex=6b03dc9e&is=6b028b1e&hm=15881ac7bfcac84da665415cccc412315165c05f49c9594904771b786a120586&format=webp"];
    const img = document.getElementById("logo");
    img.onerror = () => { if (tries.length) img.src = tries.shift(); else img.onerror = null; };
    if (img.complete && img.naturalWidth === 0) img.onerror();
  })();

  /* build animated name letters */
  const nameEl = document.getElementById("name");
  [...nameEl.dataset.text].forEach((c, i) => {
    const s = document.createElement("span");
    s.className = "ch";
    s.style.setProperty("--i", i);
    s.textContent = c;
    nameEl.appendChild(s);
  });

  /* music: browsers only allow sound after a real click, tap or key press,
     so it tries right away, then again on the very first one of those */
  const music = document.getElementById("music");
  music.volume = 0.4;
  const UNLOCK = ["pointerdown", "pointerup", "touchend", "click", "keydown"];
  let started = false;
  function startMusic() {
    if (started) return;
    const p = music.play();
    if (p) p.then(() => {
      started = true;
      UNLOCK.forEach(e => removeEventListener(e, startMusic, true));
    }).catch(() => {});
  }
  UNLOCK.forEach(e => addEventListener(e, startMusic, true));
  startMusic();
  music.addEventListener("canplay", startMusic, { once: true });

  /* build changelog */
  const logEl = document.getElementById("changelog");
  CHANGELOG.forEach(u => {
    const d = document.createElement("div");
    d.className = "log reveal";
    const top = document.createElement("div"); top.className = "log-top";
    const t = document.createElement("div"); t.className = "log-title";
    if (u.tag) { const g = document.createElement("span"); g.className = "log-tag"; g.textContent = u.tag; t.appendChild(g); }
    t.appendChild(document.createTextNode(u.title || ""));
    const dt = document.createElement("div"); dt.className = "log-date"; dt.textContent = u.date || "";
    top.append(t, dt);
    const ul = document.createElement("ul");
    (u.items || []).forEach(i => { const li = document.createElement("li"); li.textContent = i; ul.appendChild(li); });
    d.append(top, ul);
    logEl.appendChild(d);
  });

  /* build X section */
  const xf = document.getElementById("xfollow");
  xf.href = "https://x.com/" + X_HANDLE;
  document.getElementById("xhandle").textContent = "@" + X_HANDLE;
  const xp = document.getElementById("xposts");
  if (X_POSTS.length) {
    X_POSTS.forEach(url => {
      const q = document.createElement("blockquote");
      q.className = "twitter-tweet";
      q.setAttribute("data-theme", "dark");
      q.setAttribute("data-dnt", "true");
      q.setAttribute("data-conversation", "none");
      const a = document.createElement("a");
      a.href = url.replace("://x.com/", "://twitter.com/");
      a.textContent = "View post on X";
      q.appendChild(a);
      xp.appendChild(q);
    });
    const sc = document.createElement("script");
    sc.src = "https://platform.twitter.com/widgets.js"; sc.async = true;
    document.body.appendChild(sc);
  } else {
    xp.innerHTML = '<div class="x-empty reveal">no posts added yet</div>';
  }

  /* fade sections in as you scroll */
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
  }), { threshold: 0.15 });
  document.querySelectorAll(".reveal").forEach(el => io.observe(el));

  /* floating particles */
  const cv = document.getElementById("particles");
  const ctx = cv.getContext("2d");
  let W, H, pts = [];
  function resize() {
    W = cv.width = innerWidth; H = cv.height = innerHeight;
    pts = Array.from({ length: Math.min(90, Math.floor(W * H / 14000)) }, () => ({
      x: Math.random() * W, y: Math.random() * H,
      r: Math.random() * 1.6 + .3,
      vx: (Math.random() - .5) * .25, vy: -Math.random() * .4 - .1,
      a: Math.random() * .6 + .2
    }));
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (const p of pts) {
      p.x += p.vx; p.y += p.vy;
      if (p.y < -5) { p.y = H + 5; p.x = Math.random() * W; }
      if (p.x < -5) p.x = W + 5; if (p.x > W + 5) p.x = -5;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(170,160,255,${p.a})`; ctx.fill();
    }
    requestAnimationFrame(draw);
  }
  addEventListener("resize", resize);
  resize(); draw();
</script>
</body>
</html>
